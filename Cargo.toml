[package]
name = "mcp-shell"
version = "0.1.3"
edition = "2021"
description = "Serveur MCP (HTTP streamable + TLS) exposant l'exécution de commandes shell sous liste blanche"
rust-version = "1.89"
repository = "https://github.com/openssas/mcp-shell"
readme = "README.md"
license = "MIT"

[dependencies]
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json"] }
axum-server = { version = "0.9", default-features = false, features = ["tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
ipnet = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
libc = "0.2"
anyhow = "1"
schemars = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
