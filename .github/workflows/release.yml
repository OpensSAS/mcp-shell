name: Release

# Publier une version (après avoir fusionné dans main le passage de version dans
# Cargo.toml et la section datée du CHANGELOG.md) :
#   - onglet Actions -> Release -> Run workflow (branche main) : le workflow crée
#     lui-même le tag vX.Y.Z d'après Cargo.toml ;
#   - ou, au choix, pousser le tag : git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write      # créer la Release
  id-token: write      # attestation de provenance
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Déterminer le tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::à lancer depuis la branche main (lancé depuis $GITHUB_REF)"
              exit 1
            fi
            tag="v$v"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::le tag $tag existe déjà : passer d'abord version dans Cargo.toml"
              exit 1
            fi
          else
            tag=$GITHUB_REF_NAME
            if [ "$tag" != "v$v" ]; then
              echo "::error::tag $tag, mais Cargo.toml indique $v"
              exit 1
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Version publiée : $tag (commit $GITHUB_SHA)"

      - name: Le CHANGELOG doit décrire la version
        run: |
          v=${TAG#v}
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::aucune section ## [$v] dans CHANGELOG.md"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo test --locked --target x86_64-unknown-linux-musl
      - run: scripts/package.sh

      - name: Test d'installation (Debian 12, Alpine 3.20)
        run: |
          scripts/test-install.sh debian:12 dist/*.tar.gz
          scripts/test-install.sh alpine:3.20 dist/*.tar.gz

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Créer la Release (et le tag s'il n'existe pas encore)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "mcp-shell ${TAG#v}" \
            --notes-file notes.md
